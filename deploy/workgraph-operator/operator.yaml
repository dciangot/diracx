apiVersion: v1
kind: ServiceAccount
metadata:
  name: workgraph-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workgraph-operator
rules:
  - apiGroups: [workgraphs.diracx.io]
    resources: [workgraphs]
    verbs: [get, list]
  - apiGroups: [workgraphs.diracx.io]
    resources: [workgraphs/status]
    verbs: [patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workgraph-operator
subjects:
  - kind: ServiceAccount
    name: workgraph-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workgraph-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workgraph-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workgraph-operator
  template:
    metadata:
      labels:
        app: workgraph-operator
    spec:
      serviceAccountName: workgraph-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          # Build and load this local image, or replace it with your pushed image.
          image: diracx-workgraph-operator:local
          imagePullPolicy: IfNotPresent
          args: [--interval, "30"]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
